name: Bug Report
description: Report a bug to help us improve AXON
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Run 'axon deploy production'
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include logs, errors, or screenshots.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: AXON Version
      description: Run `axon --version`
      placeholder: "e.g. v0.11.0"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Examples:
          - OS: macOS 14.5 / Ubuntu 22.04
          - Shell: bash 3.2 / zsh 5.9
          - Docker: 24.0.7
          - nginx: 1.24
      render: yaml
    validations:
      required: true

  - type: dropdown
    id: deployment-mode
    attributes:
      label: Deployment Mode
      options:
        - Docker containers
        - Static sites
        - Both
        - N/A
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Run with `--verbose` and paste the output
      render: shell
